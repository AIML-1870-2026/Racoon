                                    href={`https://cneos.jpl.nasa.gov/sentry/details.html#?des=${encodeURIComponent(selectedRow.des)}`}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="block text-center py-2 bg-[#2dd4bf] text-black rounded hover:bg-[#5eead4] transition-colors"
                                >
                                    View on CNEOS Sentry →
                                </a>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [activeTab, setActiveTab] = useState(null);
            const [selectedNEO, setSelectedNEO] = useState(null);
            const [neoData, setNeoData] = useState([]);
            const [currentTime, setCurrentTime] = useState(new Date());
            const [isMobile, setIsMobile] = useState(window.innerWidth < 900);
            const [showGlobe, setShowGlobe] = useState(true);
            const [panelWidth, setPanelWidth] = useState(38); // percentage
            const [isDragging, setIsDragging] = useState(false);

            // Update time every second
            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            // Handle resize
            useEffect(() => {
                const handleResize = () => {
                    setIsMobile(window.innerWidth < 900);
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            // URL hash handling
            useEffect(() => {
                const hash = window.location.hash;
                if (hash.startsWith('#neo=')) {
                    const designation = decodeURIComponent(hash.replace('#neo=', '').replace(/\+/g, ' '));
                    setSelectedNEO({
                        designation,
                        name: designation,
                        sourceTab: 'neows'
                    });
                    setActiveTab('neows');
                }
            }, []);

            // Update URL when NEO selected
            useEffect(() => {
                if (selectedNEO) {
                    window.location.hash = `neo=${encodeURIComponent(selectedNEO.designation).replace(/%20/g, '+')}`;
                } else {
                    if (window.location.hash) {
                        history.pushState('', document.title, window.location.pathname);
                    }
                }
            }, [selectedNEO]);

            // Fetch NEO data on page load for the radar
            useEffect(() => {
                const fetchNeoData = async () => {
                    const today = new Date();
                    const endDate = new Date(today);
                    endDate.setDate(endDate.getDate() + 6);

                    const url = `${NEOWS_BASE}?start_date=${formatDate(today)}&end_date=${formatDate(endDate)}&api_key=${NASA_API_KEY}`;

                    try {
                        const response = await fetch(url);
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const json = await response.json();
                        const allNEOs = Object.values(json.near_earth_objects || {}).flat();
                        setNeoData(allNEOs);
                    } catch (err) {
                        console.error('Failed to fetch NEO data:', err);
                    }
                };

                fetchNeoData();
            }, []);

            const handleSelectNEO = (neo) => {
                setSelectedNEO(neo);
            };

            const handleClearSelection = () => {
                setSelectedNEO(null);
            };

            const handleNeoDataLoaded = (data) => {
                setNeoData(data);
            };

            // Handle panel resize dragging
            useEffect(() => {
                const handleMouseMove = (e) => {
                    if (!isDragging) return;
                    const newWidth = ((window.innerWidth - e.clientX) / window.innerWidth) * 100;
                    setPanelWidth(Math.max(20, Math.min(70, newWidth)));
                };

                const handleMouseUp = () => {
                    setIsDragging(false);
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                };

                if (isDragging) {
                    document.body.style.cursor = 'col-resize';
                    document.body.style.userSelect = 'none';
                    window.addEventListener('mousemove', handleMouseMove);
                    window.addEventListener('mouseup', handleMouseUp);
                }

                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mouseup', handleMouseUp);
                };
            }, [isDragging]);

            const isExpanded = activeTab === null;

            return (
                <div className="min-h-screen bg-[#000000] text-white">
                    <StarField />

                    {/* Header */}
                    <header className="relative z-10 border-b border-[#1a1d26] bg-[#08090d]/90 backdrop-blur scanlines">
                        <div className="max-w-[1800px] mx-auto px-4 py-4 flex justify-between items-center">
                            <div>
                                <h1 className="font-display text-2xl md:text-3xl font-bold tracking-wider text-white">
                                    NEO TRACKER
                                </h1>
                                <p className="text-xs text-[#71717a] tracking-wide">
                                    Near-Earth Object Surveillance Dashboard
                                </p>
                            </div>
                            <div className="text-right">
                                <p className="font-mono text-sm text-[#2dd4bf]">
                                    {currentTime.toISOString().replace('T', ' ').substring(0, 19)} UTC
                                </p>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="relative z-10 flex flex-col md:flex-row" style={{ height: 'calc(100vh - 80px)' }}>
                        {/* Radar Panel */}
                        {(!isMobile || showGlobe) && (
                            <div
                                className={`
                                    bg-[#000000]
                                    ${isMobile ? 'h-[50vh] w-full' : 'h-full'}
                                `}
                                style={!isMobile ? { width: `${isExpanded ? 70 : 100 - panelWidth}%` } : {}}
                            >
                                <Globe
                                    neoData={neoData}
                                    selectedNEO={selectedNEO}
                                    onSelectNEO={handleSelectNEO}
                                    isExpanded={isExpanded}
                                />
                            </div>
                        )}

                        {/* Resizable Divider */}
                        {!isMobile && !isExpanded && (
                            <div
                                className="w-1 h-full bg-[#1a1d26] hover:bg-[#2dd4bf] cursor-col-resize transition-colors flex items-center justify-center group"
                                onMouseDown={() => setIsDragging(true)}
                            >
                                <div className="w-1 h-8 bg-[#2a2d36] group-hover:bg-[#2dd4bf] rounded-full"></div>
                            </div>
                        )}

                        {/* Tab Panel */}
                        <div
                            className={`
                                flex flex-col bg-[#08090d] border-l border-[#1a1d26]
                                ${isMobile ? 'flex-1' : 'h-full'}
                            `}
                            style={!isMobile ? { width: `${isExpanded ? 30 : panelWidth}%` } : {}}
                        >
                            {/* Tab Bar */}
                            <div className="border-b border-[#1a1d26] px-4">
                                {isMobile && (
                                    <button
                                        onClick={() => setShowGlobe(!showGlobe)}
                                        className="w-full py-2 text-sm text-[#71717a] hover:text-white border-b border-[#1a1d26]"
                                    >
                                        🌍 {showGlobe ? 'Hide' : 'Show'} Globe
                                    </button>
                                )}
                                <div className="flex gap-1 pt-2">
                                    <button
                                        onClick={() => setActiveTab('neows')}
                                        className={`
                                            px-4 py-3 text-sm transition-colors
                                            ${activeTab === 'neows' ? 'text-white tab-active' : 'text-[#71717a] hover:text-white'}
                                        `}
                                    >
                                        This Week
                                    </button>
                                    <button
                                        onClick={() => setActiveTab('sbdb')}
                                        className={`
                                            px-4 py-3 text-sm transition-colors
                                            ${activeTab === 'sbdb' ? 'text-white tab-active' : 'text-[#71717a] hover:text-white'}
                                        `}
                                    >
                                        Archive
                                    </button>
                                    <button
                                        onClick={() => setActiveTab('sentry')}
                                        className={`
                                            px-4 py-3 text-sm transition-colors
                                            ${activeTab === 'sentry' ? 'text-white tab-active' : 'text-[#71717a] hover:text-white'}
                                        `}
                                    >
                                        Collision Risk
                                    </button>
                                </div>

                                {/* Sync Indicator */}
                                {selectedNEO && (
                                    <div className="flex items-center gap-2 py-2 text-xs">
                                        <span className="text-[#2dd4bf]">🔗 Synced: {selectedNEO.name}</span>
                                        <button
                                            onClick={handleClearSelection}
                                            className="text-[#71717a] hover:text-white"
                                        >
                                            ✕
                                        </button>
                                        {activeTab && activeTab !== selectedNEO.sourceTab && (
                                            <div className="flex gap-2 ml-auto">
                                                {selectedNEO.sourceTab !== 'neows' && (
                                                    <button
                                                        onClick={() => setActiveTab('neows')}
                                                        className="text-[#71717a] hover:text-[#2dd4bf]"
                                                    >
                                                        → This Week
                                                    </button>
                                                )}
                                                {selectedNEO.sourceTab !== 'sbdb' && (
                                                    <button
                                                        onClick={() => setActiveTab('sbdb')}
                                                        className="text-[#71717a] hover:text-[#2dd4bf]"
                                                    >
                                                        → Archive
                                                    </button>
                                                )}
                                                {selectedNEO.sourceTab !== 'sentry' && (
                                                    <button
                                                        onClick={() => setActiveTab('sentry')}
                                                        className="text-[#71717a] hover:text-[#2dd4bf]"
                                                    >
                                                        → Risk
                                                    </button>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>

                            {/* Tab Content */}
                            <div className="flex-1 overflow-hidden">
                                {activeTab === null && (
                                    <div className="flex flex-col items-center justify-center h-full text-center p-8">
                                        <div className="text-6xl mb-4">🌍</div>
                                        <h2 className="font-display text-xl text-white mb-2">
                                            Welcome to NEO Tracker
                                        </h2>
                                        <p className="text-[#71717a] text-sm max-w-md">
                                            Select a tab to explore near-Earth objects.
                                            The globe shows this week's asteroid approaches —
                                            drag to rotate, scroll to zoom. Amber dots indicate
                                            potentially hazardous asteroids.
                                        </p>
                                    </div>
                                )}

                                {activeTab === 'neows' && (
                                    <ThisWeekTab
                                        selectedNEO={selectedNEO}
                                        onSelectNEO={handleSelectNEO}
                                        onDataLoaded={handleNeoDataLoaded}
                                    />
                                )}

                                {activeTab === 'sbdb' && (
                                    <ArchiveTab
                                        selectedNEO={selectedNEO}
                                        onSelectNEO={handleSelectNEO}
                                    />
                                )}

                                {activeTab === 'sentry' && (
                                    <CollisionRiskTab
                                        selectedNEO={selectedNEO}
                                        onSelectNEO={handleSelectNEO}
                                    />
                                )}
                            </div>
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="fixed bottom-0 left-0 right-0 z-10 bg-[#08090d]/90 backdrop-blur border-t border-[#1a1d26] py-2 px-4">
                        <div className="max-w-[1800px] mx-auto flex justify-between items-center text-xs text-[#71717a]">
                            <span>Data provided by NASA APIs</span>
                            <a
                                href="https://api.nasa.gov"
                                target="_blank"
                                rel="noopener noreferrer"
                                className="hover:text-white transition-colors"
                            >
                                api.nasa.gov
                            </a>
                        </div>
                    </footer>
                </div>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
